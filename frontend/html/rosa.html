<!DOCTYPE html>
<html lang="it">
<head>
  <!-- Definizione della codifica dei caratteri e del viewport responsive per mobile/desktop -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FootManager – Rosa</title>
  <!-- Preconnessione ai Google Fonts per ottimizzare il caricamento dei font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <!-- Importazione font 'Barlow Condensed' e 'Barlow' da Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet" />
  <link href="/html/css/stylerosa.css" rel="stylesheet" />
  <link href="/html/css/styleall.css" rel="stylesheet" />
</head>
<body>
<div class="app">

  <!-- ══ SIDEBAR ══ -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="icon">⚽</div>
      <span>FootManager</span>
    </div>

    <nav class="nav-section">
      <div class="nav-label">Principale</div>
      <a class="nav-item" id="nav-dashboard" href="/html/pages/dashboard-allenatore.html"><span class="ico">🏠</span>Dashboard</a>
      <a class="nav-item active" href="#"><span class="ico">👥</span>Rosa</a>
      <a class="nav-item" href="/html/calendario.html"><span class="ico">📅</span>Calendario</a>
      <a class="nav-item" href="/html/statistiche.html"><span class="ico">📊</span>Statistiche</a>
      <a class="nav-item" href="/html/messaggi.html"><span class="ico">💬</span>Messaggi</a>
    </nav>

    <!-- Sezione navigazione principale -->
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="avatar" id="sb-avatar">?</div>
        <div class="user-info">
          <strong id="sb-nome">—</strong>
          <small id="sb-ruolo">—</small>
        </div>
        <button class="btn-logout" onclick="logout()">Esci</button>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <h1>Rosa della Squadra</h1>
      <div class="topbar-right">
        <button class="btn-ghost" id="btn-export">↓ Esporta CSV</button>
      </div>
    </div>

    <div class="content">

      <!-- SOMMARIO -->
      <div class="summary-row">
        <div class="summary-card"><div class="val">—</div><div class="lbl">Totale rosa</div></div>
        <div class="summary-card"><div class="val" style="color:#f87171">—</div><div class="lbl">Attaccanti</div></div>
        <div class="summary-card"><div class="val" style="color:#60a5fa">—</div><div class="lbl">Centrocampisti</div></div>
        <div class="summary-card"><div class="val" style="color:#facc15">—</div><div class="lbl">Difensori</div></div>
        <div class="summary-card"><div class="val" style="color:#a78bfa">—</div><div class="lbl">Portieri</div></div>
      </div>

      <!-- FILTRI -->
      <div class="filters-bar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="Cerca per nome, ruolo, numero..." oninput="filterPlayers()" />
        </div>
        <div class="filter-group">
          <button class="filter-btn active" onclick="setFilter('tutti',this)">Tutti</button>
          <button class="filter-btn" onclick="setFilter('ATT',this)">ATT</button>
          <button class="filter-btn" onclick="setFilter('CEN',this)">CEN</button>
          <button class="filter-btn" onclick="setFilter('DIF',this)">DIF</button>
          <button class="filter-btn" onclick="setFilter('POR',this)">POR</button>
        </div>
        <div class="view-toggle">
          <div class="view-btn active" id="btn-grid" onclick="setView('grid')" title="Griglia">⊞</div>
          <div class="view-btn" id="btn-list" onclick="setView('list')" title="Lista">☰</div>
        </div>
      </div>

      <!-- GRID VIEW -->
      <div id="view-grid"></div>

      <!-- LIST VIEW -->
      <div id="view-list" style="background:var(--dark2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;">
        <table>
          <thead>
            <tr>
              <th onclick="sortRosaList('numero')" style="cursor: pointer;" title="Ordina per numero maglia"># ↕</th>
              <th onclick="sortRosaList('nome')" style="cursor: pointer;" title="Ordina per nome/cognome">Giocatore ↕</th>
              <th onclick="sortRosaList('ruolo')" style="cursor: pointer;" title="Ordina per ruolo">Pos. ↕</th>
              <th onclick="sortRosaList('piede')" style="cursor: pointer;" title="Ordina per piede">Piede ↕</th>
              <th onclick="sortRosaList('presenze')" style="cursor: pointer;" title="Ordina per presenze">Pres. ↕</th>
              <th onclick="sortRosaList('gol')" style="cursor: pointer;" title="Ordina per gol">Gol ↕</th>
              <th onclick="sortRosaList('assist')" style="cursor: pointer;" title="Ordina per assist">Assist ↕</th>
              <th>Azioni</th>
            </tr>
          </thead>
          <tbody id="list-body"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<!-- MODAL DETTAGLIO GIOCATORE -->
<div class="modal-overlay" id="modal-detail">
  <div class="modal">
    <div class="modal-hero" id="detail-hero"></div>
    <div class="modal-body" id="detail-body"></div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeModal('modal-detail')">Chiudi</button>
    </div>
  </div>
</div>

  <script src="js/utils.js"></script>
  <script src="js/rosa.js"></script>
</body>
</html>
