<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FootManager – Log di Sistema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet" />
  

  <link href="/html/css/stylestaff.css" rel="stylesheet" />
</head>
<body>
<div class="app">


  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="icon">⚽</div>
      <span>FootManager</span>
    </div>
    <div class="nav-label">Gestione sistema</div>
    <a class="nav-item" href="/html/pages/dashboardfull.html"><span>🏠</span> Dashboard</a>
    <a class="nav-item" href="/html/pages/dashboardfull.html"><span>👤</span> Utenti</a>
    <a class="nav-item" href="/html/pages/dashboardfull.html"><span>🛡</span> Squadre</a>
    <a class="nav-item" href="/html/pages/dashboardfull.html"><span>🎮</span> Quiz</a>
    <a class="nav-item" href="/html/pages/dashboardfull.html"><span>🏅</span> Badge</a>
    <a class="nav-item active" href="/html/logs.html"><span>📋</span> Log sistema</a>
    <a class="nav-item" href="#"><span>⚙️</span> Impostazioni</a>
    
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="avatar" id="sb-avatar">?</div>
        <div class="user-info">
          <strong id="sb-nome">—</strong>
          <small id="sb-ruolo">—</small>
        </div>
        <button class="btn-logout" onclick="logout()">Esci</button>
      </div>
    </div>
  </aside>

  <!-- CONTENUTO PRINCIPALE -->
  <div class="main">
    <div class="topbar">
      <h1>Pannello Admin — Log di Sistema</h1>
      <div class="topbar-right">
        <button class="btn-primary" id="btn-refresh">🔄 Aggiorna Log</button>
      </div>
    </div>

    <div class="content">
      <div class="table-card">
        <div class="table-card-header">
          <h2>Registro Eventi Server</h2>
        </div>
        <table>
          <thead>
            <tr>
              <th>Data / Ora</th>
              <th>Livello</th>
              <th>Modulo</th>
              <th>Utente / IP</th>
              <th>Azione</th>
              <th>Dettagli</th>
            </tr>
          </thead>
          <tbody id="logs-table-body">
            <tr>
              <td colspan="6" style="text-align:center; color:var(--muted); padding: 2rem;">Caricamento log in corso…</td>
            </tr>
          </tbody>
        </table>

        <!-- PAGINAZIONE -->
        <div style="display:flex; justify-space-between; align-items:center; padding: 1rem 1.25rem; border-top: 1px solid var(--border, #30363d);">
          <button class="btn-sm" id="btn-prev" onclick="cambiaPagina(-1)" disabled>← Precedente</button>
          <span id="page-info" style="font-size: 0.85rem; color: var(--muted);">Pagina 1</span>
          <button class="btn-sm" id="btn-next" onclick="cambiaPagina(1)">Successiva →</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="/html/js/utils.js"></script>
<script src="/html/js/logs.js"></script>
</body>
</html>
