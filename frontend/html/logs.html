<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FootManager – Log di Sistema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet" />
  <!-- I tuoi fogli di stile -->
  <link href="/css/styleclassifica.css" rel="stylesheet" /> 
  <link href="/css/stylelogs.css" rel="stylesheet" />
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="icon">⚽</div>
      <span>FootManager</span>
    </div>

    <nav class="nav-section">
      <div class="nav-label">Amministrazione</div>
      <a class="nav-item" href="/html/pages/dashboard-dirigenza.html"><span class="ico">🏠</span>Dashboard</a>
      <a class="nav-item active" href="#"><span class="ico">📜</span>Log di Sistema</a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-card">
        <div class="avatar" id="sb-avatar">?</div>
        <div class="user-info">
          <strong id="sb-nome">—</strong>
          <small id="sb-ruolo">—</small>
        </div>
        <button class="btn-logout" onclick="logout()">Esci</button>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1>Log di Sistema</h1>
      <div style="font-size:0.85rem;color:var(--muted)">Monitoraggio Attività Server</div>
    </div>

    <div class="content">
      <div class="card">
        <div class="card-header">
          <h2>📜 Registro Eventi</h2>
          <button id="btn-refresh" style="padding:4px 8px; cursor:pointer;">🔄 Aggiorna</button>
        </div>
        <div class="card-body" style="padding: 0;">
          <table class="table-logs">
            <thead>
              <tr>
                <th>Data / Ora</th>
                <th>Livello</th>
                <th>Modulo</th>
                <th>Utente / IP</th>
                <th>Azione</th>
                <th>Dettagli</th>
              </tr>
            </thead>
            <tbody id="logs-table-body">
              <tr><td colspan="6" style="text-align:center; padding: 2rem;">Caricamento log…</td></tr>
            </tbody>
          </table>
          
          <div class="pagination-controls" style="padding: 15px;">
            <button id="btn-prev" onclick="cambiaPagina(-1)">Precedente</button>
            <span id="page-info">Pagina 1</span>
            <button id="btn-next" onclick="cambiaPagina(1)">Successiva</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/logs.js"></script>
</body>
</html>
