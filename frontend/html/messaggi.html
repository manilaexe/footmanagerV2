<!DOCTYPE html>
<html lang="it">
<head>
    <!-- Definizione della codifica dei caratteri e del viewport responsive per mobile/desktop -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FootManager - Messaggi</title>
    <!-- Preconnessione ai Google Fonts per ottimizzare il caricamento dei font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- Importazione font 'Barlow Condensed' e 'Barlow' da Google Fonts -->    
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
    <link href="/html/css/styleall.css" rel="stylesheet">
</head>
<body>
<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="icon">⚽</div>
            <span>FootManager</span>
        </div>

        <!-- Sezione navigazione principale -->
        <nav class="nav-section">
            <div class="nav-label">Principale</div>
            <a class="nav-item" id="nav-dashboard" href="/html/pages/dashboard-allenatore.html"><span class="ico">🏠</span> Dashboard</a>
            <a class="nav-item" href="/html/rosa.html"><span class="ico">👥</span> Rosa</a>
            <a class="nav-item" href="/html/calendario.html"><span class="ico">📅</span> Calendario</a>
            <a class="nav-item" href="/html/statistiche.html"><span class="ico">📊</span> Statistiche</a>
            <a class="nav-item active" href="/html/messaggi.html"><span class="ico">💬</span> Messaggi</a>
            <a class="nav-item" id="nav-badge" href="badge.html"><span class="ico">🎖️</span> I miei badge</a>
            <a class="nav-item" href="classifica.html"><span class="ico">🏆</span> Classifica</a>
            <a class="nav-item" id="nav-performance" href="dirigenza-performance.html"><span class="ico">⚽</span>Performance squadra</a>
        </nav>

        <!-- Footer della sidebar con profilo utente loggato e tasto logout -->
        <div class="sidebar-footer">
            <div class="user-card">
                <div class="avatar">?</div>
                <div class="user-info">
                    <strong>—</strong>
                    <small>—</small>
                </div>
                <button class="btn-logout" onclick="logout()">Esci</button>
            </div>
        </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
        <div class="topbar">
            <h1>Messaggi</h1>
            <div class="topbar-right">
                <button class="btn-primary" id="btn-nuovo-messaggio" onclick="openModal('modal-messaggio')">+ Nuovo Messaggio</button>
            </div>
        </div>

        <div class="content">

            <!-- KPI -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Messaggi inviati</div>
                    <div class="stat-value">—</div>
                    <div class="stat-sub">Stagione corrente</div>
                </div>
                <div class="stat-card info">
                    <div class="stat-label">Da leggere</div>
                    <div class="stat-value">—</div>
                    <div class="stat-sub">— giocatori</div>
                </div>
                <div class="stat-card warn">
                    <div class="stat-label">Ultimo invio</div>
                    <div class="stat-value" style="font-size:1.3rem;">—</div>
                    <div class="stat-sub">—:—</div>
                </div>
            </div>

            <!-- LISTA + COMPOSIZIONE -->
            <div class="grid-2" id="msg-grid">
                <!-- LISTA -->
                <div class="card">
                    <div class="card-header">
                        <h2 id="msg-list-title">Messaggi inviati</h2>
                    </div>
                    <div class="card-body">
                        <div class="msg-list">
                            <div class="msg-item">
                                <div class="msg-header">
                                    <span class="msg-to">→ —</span>
                                    <span class="msg-time">— —:—</span>
                                </div>
                                <div class="msg-text">—</div>
                                <div class="msg-status letto">✔✔—</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- COMPOSIZIONE (visibile solo ad allenatore/staff, nascosta ai giocatori via JS) -->
                <div class="card" id="compose-card">
                    <div class="card-header">
                        <h2>Nuovo Messaggio</h2>
                    </div>
                    <div class="card-body">
                        <div class="compose-box">
                            <label>Destinatario</label>
                            <select id="destinatario">
                                <option value="">-- Seleziona destinatario --</option>
                                <optgroup label="Per ruolo">
                                    <option value="ruolo:Portiere">Tutti i portieri</option>
                                    <option value="ruolo:Difensore">Tutti i difensori</option>
                                    <option value="ruolo:Centrocampista">Tutti i centrocampisti</option>
                                    <option value="ruolo:Attaccante">Tutti gli attaccanti</option>
                                </optgroup>
                            </select>
                            <label>Messaggio</label>
                            <textarea rows="10" placeholder="Scrivi il messaggio..."></textarea>
                            <button class="btn-primary" style="align-self:flex-end;" onclick="sendMsg()">Invia Messaggio →</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL -->

<div class="modal-overlay" id="modal-messaggio">
    <div class="modal">
        <h3>Invio Rapido</h3>
        <div class="form-group">
            <label>Destinatario</label>
            <select>
                <option value="">-- Seleziona destinatario --</option>
                <optgroup label="Per ruolo">
                    <option value="ruolo:Portiere">Tutti i portieri</option>
                    <option value="ruolo:Difensore">Tutti i difensori</option>
                    <option value="ruolo:Centrocampista">Tutti i centrocampisti</option>
                    <option value="ruolo:Attaccante">Tutti gli attaccanti</option>
                </optgroup>
            </select>
        </div>
        <div class="form-group">
            <label>Messaggio</label>
            <textarea rows="6"></textarea>
        </div>
        <div class="modal-footer">
            <button class="btn-ghost" onclick="closeModal('modal-messaggio')">Annulla</button>
            <button class="btn-primary" onclick="sendMsg()">Invia</button>
        </div>
    </div>
</div>

<script src="/html/js/utils.js"></script>
<script src="/html/js/messaggi.js"></script>
</body>
</html>
