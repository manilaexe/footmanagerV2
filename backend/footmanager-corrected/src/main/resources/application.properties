# ── Server ───────────────────────────────────────────────────────────────
server.port=8080

# ── DataSource ───────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/footmanager?useSSL=false&serverTimezone=Europe/Rome&allowPublicKeyRetrieval=true
spring.datasource.username=footmanager
spring.datasource.password=footmanager_pwd
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ──────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway DISABILITATO: usi il tuo SQL esistente (footmanagermysql.sql)
spring.flyway.enabled=false

# ── JWT ──────────────────────────────────────────────────────────────────
app.jwt.secret=UnaSegreteDellaLunghezzaDiAlmenoTrentadueCarat!!2025
app.jwt.expiration-ms=86400000

# ── Quiz timeout ─────────────────────────────────────────────────────────
app.quiz.timeout-seconds=40

# ── CORS ─────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:5500

# ── Logging ──────────────────────────────────────────────────────────────
logging.level.it.footmanager=DEBUG
logging.level.org.springframework.security=WARN




# ── API esterna Serie A (openfootball/football.json) ─────────────────────
app.external.base-url=https://raw.githubusercontent.com/openfootball/football.json/master
app.external.stagione=2026-27
app.external.file-lega=it.1.json

# Nome della squadra come compare nel JSON + eventuali varianti
app.external.squadra-nome=Juventus FC
app.external.squadra-alias=Juventus FC,Juventus Turin

# Ogni quanti minuti riscaricare il JSON (a monte si aggiorna 1 volta al giorno)
app.external.cache-minuti=180

# Soglie di riferimento per il grafico trend (punti per partita)
app.external.ppm-champions=2.0
app.external.ppm-scudetto=2.3

# Import partite nel calendario: l'API spesso non dà l'orario
app.external.orario-default=20:45
app.external.durata-minuti=120